<header class="app-header">
  <div class="brand">
    <span class="logo-icon">🎬</span>
    <h1>Cinema UVEG</h1>
  </div>
</header>

<main class="main-content">
  <div *ngIf="loadingDetail" class="spinner">Obteniendo detalles de la película...</div>

  <app-movie-detail 
    *ngIf="selectedMovie && !loadingDetail" 
    [movie]="selectedMovie" 
    (back)="onClearSelection()"
  ></app-movie-detail>

  <app-movie-list 
    *ngIf="!selectedMovie && !loadingDetail" 
    (selectMovie)="onMovieSelected($event)"
  ></app-movie-list>
</main>
