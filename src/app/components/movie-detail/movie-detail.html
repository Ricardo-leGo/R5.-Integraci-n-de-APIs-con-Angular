<div *ngIf="movie" class="detail-container">
  <button class="btn-back" (click)="onBack()">← Volver a la lista de Cinema UVEG</button>

  <div class="detail-card">
    <div class="poster-wrapper">
      <img 
        [src]="movie.poster_path ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path : 'https://via.placeholder.com/500x750?text=Sin+Imagen'" 
        [alt]="movie.title" 
      />
    </div>
    <div class="detail-info">
      <h2>{{ movie.title }}</h2>
      <p class="release-date"><strong>Fecha de estreno:</strong> {{ movie.release_date }}</p>
      <div class="rating">
        <span>⭐ {{ movie.vote_average | number:'1.1-1' }} / 10</span>
        <small>({{ movie.vote_count }} votos)</small>
      </div>
      <h3>Sinopsis</h3>
      <p class="overview">{{ movie.overview || 'Sin descripción disponible.' }}</p>
    </div>
  </div>
</div>
